spring:
  application:
    name: spring-security-auth-api

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

# JWT Configuration
# The application both issues and validates JWTs, so both issuer and audience are the same
jwt:
  secret: ${JWT_SECRET}
  issuer: auth-api
  audience: auth-api
  access-token-ttl: 15m